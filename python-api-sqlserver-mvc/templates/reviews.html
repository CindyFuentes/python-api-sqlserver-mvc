{% extends "base.html" %}{% block heading %}Reseñas{% endblock %}{% block body %}<p><a class="btn primary" href="/resenas/nueva">＋ Nueva reseña</a></p><div class="card"><table><tr><th>Atractivo</th><th>Calificación</th><th>Comentario</th><th>Acciones</th></tr>{% for x in rows %}<tr><td>{{x.atractivo}}</td><td>{{'★'*x.calificacion}}</td><td>{{x.comentario}}</td><td><a href="/resenas/{{x.id}}/editar">Editar</a> <form class="inline" method="post" action="/resenas/{{x.id}}/eliminar"><button class="link">Eliminar</button></form></td></tr>{% else %}<tr><td colspan="4">No hay reseñas.</td></tr>{% endfor %}</table></div>{% endblock %}
