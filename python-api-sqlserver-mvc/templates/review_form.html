{% extends "base.html" %}{% block heading %}{{'Editar' if item else 'Nueva'}} reseña{% endblock %}{% block body %}<div class="card form"><form method="post"><label>ID del atractivo<input type="number" name="atractivo_id" min="1" required value="{{item.atractivo_id if item else ''}}"></label><label>Calificación<select name="calificacion">{% for n in range(1,6) %}<option value="{{n}}" {% if item and item.calificacion==n %}selected{% endif %}>{{n}}</option>{% endfor %}</select></label><label>Comentario<textarea name="comentario" required>{{item.comentario if item else ''}}</textarea></label><button class="btn primary">Guardar</button> <a href="/resenas">Cancelar</a></form></div>{% endblock %}
