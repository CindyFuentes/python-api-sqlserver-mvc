{% extends "base.html" %}{% block heading %}{{'Editar' if item else 'Nuevo'}} atractivo{% endblock %}{% block body %}<div class="card form"><form method="post"><label>Nombre<input name="nombre" required value="{{item.nombre if item else ''}}"></label><label>Municipio<input name="municipio" value="{{item.municipio if item else ''}}"></label><label>Tipo<input name="tipo" value="{{item.tipo if item else ''}}"></label><label>Ubicación<input name="ubicacion" value="{{item.ubicacion if item else ''}}"></label><label>Descripción<textarea name="descripcion">{{item.descripcion if item else ''}}</textarea></label><button class="btn primary">Guardar</button> <a href="/atractivos">Cancelar</a></form></div>{% endblock %}
